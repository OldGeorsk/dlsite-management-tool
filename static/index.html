<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DLsite 音声整理工具</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>DLsite 音声整理工具</h1>
        <p id="summary">本地缓存中暂无作品</p>
        <nav class="page-nav" aria-label="页面导航">
          <a class="active" href="/">作品列表</a>
          <a href="/stats">资料库概览</a>
        </nav>
      </div>
      <a class="button secondary" href="/api/export">导出 Excel</a>
    </header>

    <section class="panel controls">
      <label class="path-field">
        <span>音声库目录</span>
        <input id="pathInput" placeholder="例如：请选择包含 RJ 作品目录的资料库根目录">
      </label>
      <label class="proxy-field">
        <span>代理</span>
        <input id="proxyInput" value="http://127.0.0.1:7892" placeholder="例如 http://127.0.0.1:7892">
      </label>
      <label class="check">
        <input id="fetchInput" type="checkbox">
        <span>扫描后抓取官网信息</span>
      </label>
      <button id="scanButton" class="button">扫描目录</button>
      <button id="fetchButton" class="button secondary">补抓官网信息</button>
      <label class="check">
        <input id="forceMetricsInput" type="checkbox">
        <span>强制刷新已有指标</span>
      </label>
      <button id="metricsButton" class="button secondary">刷新销量与评价</button>
    </section>

    <section id="jobPanel" class="panel job-panel" hidden>
      <div class="job-header">
        <strong id="jobTitle">任务准备中</strong>
        <span id="jobPercent">0%</span>
      </div>
      <div class="progress" aria-label="任务进度">
        <div id="jobBar" class="progress-bar"></div>
      </div>
      <div class="job-details">
        <span id="jobCount">0 / 0</span>
        <span id="jobCurrent">当前 RJ：-</span>
        <span id="jobMessage">等待任务开始</span>
      </div>
      <p id="jobError" class="job-error" hidden></p>
    </section>

    <section class="panel filters">
      <input id="searchInput" placeholder="搜索 RJ、标题、社团、声优、标签或路径">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="未抓取">未抓取</option>
        <option value="成功">成功</option>
        <option value="部分成功">部分成功</option>
        <option value="失败">失败</option>
      </select>
    </section>

    <section id="activeFilters" class="panel active-filters" hidden></section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>RJ号</th>
            <th>本地标题</th>
            <th>官网标题</th>
            <th>社团</th>
            <th>声优</th>
            <th>发售日</th>
            <th>标签</th>
            <th>总售出数</th>
            <th>平均评分</th>
            <th>评价人数</th>
            <th>路径</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="worksBody"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
